services:
  - type: web
    name: argus-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.pipeline.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: Argus <onboarding@resend.dev>
      - key: NOTIFICATION_EMAIL_TO
        sync: false
      - key: CRON_SECRET
        generateValue: true
