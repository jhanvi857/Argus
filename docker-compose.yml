services:
  # ============================================================================
  # PostgreSQL Database - Source of Truth for Postings, Projects & Matches
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: argus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-argus}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/seed_projects.sql:/docker-entrypoint-initdb.d/02_seed_projects.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-argus}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - argus-network

  # ============================================================================
  # Argus FastAPI Ingestion Trigger API
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: argus-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-argus}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-argus}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-Argus <onboarding@resend.dev>}
      NOTIFICATION_EMAIL_TO: ${NOTIFICATION_EMAIL_TO:-candidate@example.com}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8000}
      CRON_SECRET: ${CRON_SECRET:-}
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - argus-network

  # ============================================================================
  # Argus Frontend UI (Nginx + React SPA)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: argus-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - app
    networks:
      - argus-network

networks:
  argus-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
