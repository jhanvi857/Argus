services:
  # ============================================================================
  # n8n Automation & Cron Orchestrator (Local Dev & Interactive Debugging Only)
  # ============================================================================
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: argus-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Asia/Kolkata
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-Argus <onboarding@resend.dev>}
      - NOTIFICATION_EMAIL_TO=${NOTIFICATION_EMAIL_TO:-candidate@example.com}
      - NOTIFICATION_EMAIL_FROM=${RESEND_FROM_EMAIL:-Argus <onboarding@resend.dev>}
      - SMTP_HOST=${SMTP_HOST:-smtp.resend.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-resend}
      - SMTP_PASS=${SMTP_PASS:-${RESEND_API_KEY:-}}
      - BACKEND_URL=${BACKEND_URL:-http://app:8000}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/data/n8n_workflows
    depends_on:
      - postgres
      - app
    networks:
      - argus-network

volumes:
  n8n_data:
    driver: local
