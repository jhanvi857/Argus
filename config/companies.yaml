# Argus — config/companies.yaml
# Complete Target Company Directory categorized by hiring tiers, hiring funnel, ATS & OA platform.
# ATS types:
#   - greenhouse: Native Greenhouse board API
#   - lever: Native Lever postings API
#   - workday: Reverse-engineered Workday CXS JSON API (/wday/cxs/{tenant}/{client}/jobs)
#   - amazon: Amazon Jobs search JSON API (amazon.jobs/en/search.json)
#   - google: Google Careers search JSON API (careers.google.com/api/v3/search/)
#   - microsoft: Microsoft Careers search JSON API (gcsservices.careers.microsoft.com/search/api/v1/search)
#   - goldman: Goldman Sachs Enterprise Careers JSON API
#   - eightfold: Eightfold AI career portal API (api/apply/v2/jobs)
#   - custom: Custom ATS / SuccessFactors / Taleo / iCIMS / proprietary network endpoint

faang_maang:
